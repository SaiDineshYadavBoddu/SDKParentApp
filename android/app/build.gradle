apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

project.ext.envConfigFiles = [
        stage: '.env.stage',
        prod: '.env.prod',
]

apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"


/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.networkinternational.networkcommercial"
    defaultConfig {
        applicationId "com.networkinternational.networkcommercial"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.0.5"
        manifestPlaceholders = [
            appAuthRedirectScheme: 'com.keycloakpoc'
        ]
    }
    signingConfigs {
        release {
            storeFile file('my_release.keystore')
            storePassword 'commercial_cards_release'
            keyAlias 'my_release_alias'
            keyPassword 'commercial_cards_release'

            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    flavorDimensions 'default'
    productFlavors {
        prod {
            resValue 'string', 'app_name', '"Network Commercial"'
        }
        stage {
            applicationIdSuffix '.stage'
            resValue 'string', 'app_name', '"Network Commercial Stage"'
            resValue "string", "build_config_package", "com.networkinternational.networkcommercial"
        }
    }
}

def mintSdkAndroid = file('../../../mint-credit/services/mc-sdk/android')
def mintSdkAar = new File(mintSdkAndroid, 'sdk/build/outputs/aar/sdk-release.aar')
def parentSdkDir = new Properties()
def parentLocalProperties = rootProject.file('local.properties')
if (parentLocalProperties.exists()) {
    parentLocalProperties.withInputStream { parentSdkDir.load(it) }
}

// The app embeds a built AAR. Rebuild it from the current SDK source before this app compiles.
tasks.register('assembleMintCreditSdk', Exec) {
    group = 'build'
    description = 'Rebuilds the Mint Credit SDK release AAR from the current source.'
    workingDir mintSdkAndroid
    def androidSdk = System.getenv('ANDROID_HOME') ?: parentSdkDir.getProperty('sdk.dir')
    if (androidSdk != null) {
        environment 'ANDROID_HOME', androidSdk
    }
    commandLine './gradlew', ':sdk:assembleRelease', '--quiet'
    inputs.dir new File(mintSdkAndroid, 'sdk/src/main')
    inputs.file new File(mintSdkAndroid, 'sdk/build.gradle.kts')
    inputs.file new File(mintSdkAndroid, 'gradle/libs.versions.toml')
    outputs.file mintSdkAar
}

preBuild.dependsOn tasks.named('assembleMintCreditSdk')

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    implementation project(':react-native-otp-verify')
    // implementation project(':@react-native-community_netinfo')

    implementation files('../../../mint-credit/services/mc-sdk/android/sdk/build/outputs/aar/sdk-release.aar')
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.fragment:fragment-ktx:1.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-kotlinx-serialization:2.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation('co.hyperverge:hyperkyc:2.0.1') {
        transitive = true
        exclude group: 'co.hyperverge', module: 'hypersnap-pdf'
    }
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("com.squareup.okhttp3:logging-interceptor:4.11.0")
}

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
apply plugin: 'com.google.gms.google-services'

// Product flavors write app-stage-debug.apk under apk/stage/debug.
// `react-native run-android --mode stageDebug` looks for app-stagedebug.apk under apk/stagedebug.
["Stage", "Prod"].each { flavor ->
    ["Debug", "Release"].each { buildType ->
        def variantName = "${flavor}${buildType}"
        def cliVariant = variantName.toLowerCase()
        def flavorDir = flavor.toLowerCase()
        def buildTypeDir = buildType.toLowerCase()
        def copyTask = tasks.register("copy${variantName}ApkForCli") {
            def sourceApk = layout.buildDirectory.file("outputs/apk/${flavorDir}/${buildTypeDir}/app-${flavorDir}-${buildTypeDir}.apk")
            def cliApk = layout.buildDirectory.file("outputs/apk/${cliVariant}/app-${cliVariant}.apk")
            onlyIf { sourceApk.get().asFile.exists() }
            inputs.file(sourceApk).optional(true)
            outputs.file(cliApk)
            doLast {
                def destination = cliApk.get().asFile
                destination.parentFile.mkdirs()
                java.nio.file.Files.copy(
                    sourceApk.get().asFile.toPath(),
                    destination.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
            }
        }
        tasks.configureEach { task ->
            if (task.name == "install${variantName}") {
                task.finalizedBy(copyTask)
            }
        }
    }
}
